name: Publish EPR to GitHub Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 0.1.1 — without leading v)'
        required: true
        type: string
      installer_version:
        description: 'RigSignal release version supplying the hosted installer (without leading v)'
        required: false
        default: '0.3.2'
        type: string

env:
  INSTALLER_VERSION: ${{ inputs.installer_version || '0.3.2' }}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build package + publish EPR
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF_NAME}"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify package version
        run: |
          MANIFEST_VERSION=$(sed -n 's/^version:[[:space:]]*//p' manifest.yml)
          if [ "$MANIFEST_VERSION" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::manifest.yml version ($MANIFEST_VERSION) does not match publish version (${{ steps.ver.outputs.version }}). Update manifest.yml or use the matching tag/dispatch version."
            exit 1
          fi

      - name: Install elastic-package
        run: |
          EP_TAG=$(gh release view --repo elastic/elastic-package --json tagName -q .tagName)
          EP_VER="${EP_TAG#v}"
          gh release download "${EP_TAG}" \
            --repo elastic/elastic-package \
            --pattern "elastic-package_${EP_VER}_linux_amd64.tar.gz" \
            --output /tmp/ep.tar.gz
          tar -xz -C /usr/local/bin -f /tmp/ep.tar.gz elastic-package
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build package
        run: elastic-package build

      - name: Install PyYAML
        run: pip install pyyaml --quiet

      - name: Generate EPR index
        run: |
          python scripts/generate-epr-index.py \
            "${{ steps.ver.outputs.version }}" \
            "https://MathewRJ.github.io/RigSignal-Integration"

      - name: Verify RigSignal installer release is published
        run: |
          if ! gh release view "v${INSTALLER_VERSION}" -R MathewRJ/RigSignal >/dev/null; then
            echo "::error::RigSignal release v${INSTALLER_VERSION} not yet published; the hosted installer cannot be updated until the release candidate is cut (S8)."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download published RigSignal installer assets
        run: |
          gh release download "v${INSTALLER_VERSION}" -R MathewRJ/RigSignal \
            -p install.sh \
            -p install.sh.sha256 \
            -D installer-release
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify published installer checksum
        working-directory: installer-release
        run: sha256sum -c install.sh.sha256

      # REQUIRED: RigSignal S8 must publish artifact attestations for these release assets.
      - name: Verify published installer attestation
        working-directory: installer-release
        run: |
          if ! gh attestation verify install.sh -R MathewRJ/RigSignal; then
            echo "::error::RigSignal release v${INSTALLER_VERSION} installer lacks a verifiable artifact attestation; S8 must publish release asset attestations."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Copy published installer to dist
        run: install -m 755 installer-release/install.sh dist/install.sh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify Pages installer matches published release asset
        run: cmp -s installer-release/install.sh dist/install.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

      - name: Create GitHub Release with zip
        if: github.event_name == 'push'
        run: |
          ZIP="build/packages/rigsignal-${{ steps.ver.outputs.version }}.zip"
          gh release create "v${{ steps.ver.outputs.version }}" "${ZIP}" \
            --title "RigSignal Integration v${{ steps.ver.outputs.version }}" \
            --notes "Integration package for Elastic Fleet. Upload \`$(basename ${ZIP})\` via **Fleet → Integrations → Upload a package** on Elastic Cloud Serverless."
        env:
          GH_TOKEN: ${{ github.token }}
