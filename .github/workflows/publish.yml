name: Publish EPR to GitHub Pages

# Dispatch-only by §10.3 owner ruling (2026-08-06, GO-LEDGER) + C-3 carry
# (cmt-2026-08-25-rigsignal-tail-1): no v* tag trigger — a tag-push run both
# created a forbidden GH release path and could stall at the github-pages
# environment gate holding the `pages` concurrency group (18.4-day
# head-of-line block, §9.3 gate finding 2026-08-25). v* tags still trigger
# check.yml only.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 0.1.1 — without leading v)'
        required: true
        type: string
      installer_version:
        description: 'RigSignal release version supplying the hosted installer (without leading v)'
        required: true
        type: string

env:
  INSTALLER_VERSION: ${{ inputs.installer_version }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build package + publish EPR
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}

    steps:
      - name: Verify publish ref
        env:
          PUBLISH_REF: ${{ github.ref }}
        run: |
          if [ "$PUBLISH_REF" != "refs/heads/main" ]; then
            echo "::error::Refusing to publish from ref $PUBLISH_REF; expected refs/heads/main."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Derive version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$INPUT_VERSION" == *$'\n'* ]] || ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$' <<<"$INPUT_VERSION"; then
            echo "::error::version must be SemVer without leading v"
            exit 1
          fi
          printf 'version=%s\n' "$INPUT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify package version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          MANIFEST_VERSION=$(sed -n 's/^version:[[:space:]]*//p' manifest.yml)
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "::error::manifest.yml version ($MANIFEST_VERSION) does not match publish version ($VERSION). Update manifest.yml or use the matching tag/dispatch version."
            exit 1
          fi

      - name: Install elastic-package
        run: |
          EP_TAG=$(gh release view --repo elastic/elastic-package --json tagName -q .tagName)
          EP_VER="${EP_TAG#v}"
          gh release download "${EP_TAG}" \
            --repo elastic/elastic-package \
            --pattern "elastic-package_${EP_VER}_linux_amd64.tar.gz" \
            --output /tmp/ep.tar.gz
          tar -xz -C /usr/local/bin -f /tmp/ep.tar.gz elastic-package
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build package
        run: |
          # elastic-package v0.124.0 does not consume .elastic-package-ignore;
          # internal/files/copy.go hardcodes its skip list. This stash/EXIT trap
          # is the control that excludes these files from the package. Do not remove
          # it believing .elastic-package-ignore protects the zip.
          STASH_DIR=$(mktemp -d)
          restore_internal_files() {
            mv "$STASH_DIR/.github" .github || true
            mv "$STASH_DIR/tasks" tasks || true
            mv "$STASH_DIR/scripts" scripts || true
            rmdir "$STASH_DIR" || true
          }
          trap restore_internal_files EXIT
          mv .github "$STASH_DIR/.github"
          mv tasks "$STASH_DIR/tasks"
          mv scripts "$STASH_DIR/scripts"
          elastic-package build

      - name: Install PyYAML
        run: pip install pyyaml --quiet

      - name: Generate EPR index
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python scripts/generate-epr-index.py \
            "$VERSION" \
            "https://MathewRJ.github.io/RigSignal-Integration"

      - name: Verify RigSignal installer release is published
        run: |
          if ! gh release view "v${INSTALLER_VERSION}" -R MathewRJ/RigSignal >/dev/null; then
            echo "::error::RigSignal release v${INSTALLER_VERSION} not yet published; the hosted installer cannot be updated until the release candidate is cut (S8)."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download published RigSignal installer assets
        run: |
          gh release download "v${INSTALLER_VERSION}" -R MathewRJ/RigSignal \
            -p install.sh \
            -p install.sh.sha256 \
            -D installer-release
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify published installer checksum
        working-directory: installer-release
        run: sha256sum -c install.sh.sha256

      # REQUIRED: RigSignal S8 must publish artifact attestations for these release assets.
      - name: Verify published installer attestation
        working-directory: installer-release
        run: |
          if ! gh attestation verify install.sh -R MathewRJ/RigSignal; then
            echo "::error::RigSignal release v${INSTALLER_VERSION} installer lacks a verifiable artifact attestation; S8 must publish release asset attestations."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Copy published installer to dist
        run: install -m 755 installer-release/install.sh dist/install.sh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify Pages installer matches published release asset
        run: cmp -s installer-release/install.sh dist/install.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
