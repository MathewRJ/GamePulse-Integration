name: Package check

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: elastic-package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard published hosted installer source
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import sys
          import tempfile

          import yaml

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          if Path("install.sh").exists():
              fail("Repo-local install.sh must not exist; Pages publishes a verified RigSignal release asset.")

          with Path(".github/workflows/publish.yml").open() as workflow_file:
              workflow = yaml.safe_load(workflow_file)

          try:
              steps = workflow["jobs"]["publish"]["steps"]
          except (KeyError, TypeError):
              fail("publish.yml must define jobs.publish.steps.")

          try:
              workflow_events = workflow.get(True, workflow.get("on", {}))
              dispatch_input = workflow_events["workflow_dispatch"]["inputs"]["installer_version"]
          except (KeyError, TypeError):
              fail("publish.yml must expose the installer_version workflow-dispatch input.")

          if dispatch_input.get("required") is not True:
              fail("installer_version must be required.")
          if "default" in dispatch_input:
              fail("installer_version must not define a default.")

          installer_version = workflow.get("env", {}).get("INSTALLER_VERSION")
          expression_open = "$" + "{{"
          expression_close = "}}"
          if installer_version != f"{expression_open} inputs.installer_version {expression_close}":
              fail("INSTALLER_VERSION must use installer_version directly without a fallback.")

          release_checkout = any(
              step.get("with", {}).get("repository") == "MathewRJ/RigSignal"
              for step in steps if isinstance(step, dict)
          )
          if release_checkout:
              fail("publish.yml must download the published RigSignal release asset, not check out its repository.")

          publish_ref = next((step for step in steps
                              if step.get("name") == "Verify publish ref"), None)
          if not isinstance(publish_ref, dict):
              fail("publish.yml must define the Verify publish ref step.")
          if any(name.startswith("GITHUB_") for name in publish_ref.get("env", {})):
              fail("Verify publish ref must not bind a reserved GITHUB_* env name.")
          if publish_ref.get("env", {}).get("PUBLISH_REF") != f"{expression_open} github.ref {expression_close}":
              fail("Verify publish ref must bind github.ref as PUBLISH_REF.")

          def step_index(fragment):
              for index, step in enumerate(steps):
                  if fragment in str(step.get("run", "")):
                      return index
              fail(f"publish.yml is missing required installer gate: {fragment}")

          build_step = next((step for step in steps
                             if step.get("name") == "Build package"), None)
          if not isinstance(build_step, dict):
              fail("publish.yml must define the Build package step.")
          build_run = build_step.get("run")
          if not isinstance(build_run, str):
              fail("Build package must run a shell script.")
          required_build_fragments = (
              "STASH_DIR=$(mktemp -d)",
              "trap restore_internal_files EXIT",
              'mv .github "$STASH_DIR/.github"',
              'mv tasks "$STASH_DIR/tasks"',
              'mv scripts "$STASH_DIR/scripts"',
          )
          for fragment in required_build_fragments:
              if fragment not in build_run:
                  fail(f"Build package must retain the stash/EXIT-trap control: {fragment}")

          derive_version = next((step for step in steps
                                 if step.get("name") == "Derive version"), None)
          if not isinstance(derive_version, dict):
              fail("publish.yml must define the Derive version step.")
          derive_version_run = derive_version.get("run")
          if not isinstance(derive_version_run, str):
              fail("Derive version must run a shell script.")
          if "grep -Eq '^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$'" not in derive_version_run:
              fail("Derive version must use the anchored SemVer validation regex.")

          def version_result(value):
              with tempfile.NamedTemporaryFile() as output:
                  env = os.environ | {"INPUT_VERSION": value, "GITHUB_OUTPUT": output.name}
                  return subprocess.run(["bash", "-e", "-c", derive_version_run], env=env,
                                        stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode

          for invalid_version in ("", "v0.3.5", "0.3", "0.3.5junk", " 0.3.5", "0.3.5 ",
                                  "0.3.5\n0.3.6", "0.3.5;x", "`x`", "$(x)"):
              if version_result(invalid_version) == 0:
                  fail(f"Derive version must reject {invalid_version!r}.")
          for valid_version in ("0.3.5", "0.3.5-rc.1"):
              if version_result(valid_version) != 0:
                  fail(f"Derive version must accept {valid_version!r}.")

          release_view = step_index('gh release view "v${INSTALLER_VERSION}" -R MathewRJ/RigSignal')
          download = step_index('gh release download "v${INSTALLER_VERSION}" -R MathewRJ/RigSignal')
          checksum = step_index("sha256sum -c install.sh.sha256")
          attestation = step_index("gh attestation verify install.sh -R MathewRJ/RigSignal")
          copy = step_index("install -m 755 installer-release/install.sh dist/install.sh")
          compare = step_index("cmp -s installer-release/install.sh dist/install.sh")

          download_run = str(steps[download].get("run", ""))
          if "MathewRJ/RigSignal" not in download_run or "-p install.sh" not in download_run or "-p install.sh.sha256" not in download_run:
              fail("publish.yml must download install.sh and install.sh.sha256 from the RigSignal release.")
          if not release_view < download < checksum < attestation < copy < compare:
              fail("publish.yml installer gates must run in release-view, download, checksum, attestation, copy, and cmp order.")

          upload = next((index for index, step in enumerate(steps)
                         if step.get("uses") == "actions/upload-pages-artifact@v3"), None)
          if upload is None or compare + 1 != upload:
              fail("The installer cmp gate must run immediately before the Pages artifact upload.")
          PY

      - name: Install elastic-package
        run: |
          EP_TAG=$(gh release view --repo elastic/elastic-package --json tagName -q .tagName)
          EP_VER="${EP_TAG#v}"
          gh release download "${EP_TAG}" \
            --repo elastic/elastic-package \
            --pattern "elastic-package_${EP_VER}_linux_amd64.tar.gz" \
            --output /tmp/ep.tar.gz
          tar -xz -C /usr/local/bin -f /tmp/ep.tar.gz elastic-package
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check package
        run: elastic-package check

      # Added 2026-08-26 alongside deleting RigSignal's agent-ci.yml, whose
      # elastic-package jobs were structurally inert there (they gated on a root
      # manifest.yml that only exists in THIS repo, so every step was skipped).
      # `test static` needs no running stack, so it belongs in this fast gate.
      # NOT added: `test asset` and `test pipeline`, which require a booted
      # Elastic stack. Those have never run in either repo and remain a
      # consciously-accepted coverage gap rather than a disguised green check.
      - name: Static package tests
        run: elastic-package test static
